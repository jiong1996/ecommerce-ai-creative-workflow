<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电商 AI 自动化作图工作台</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#f3f4f6;color:#17202a;font-family:"Microsoft YaHei",system-ui,sans-serif}button,input,textarea,select{font:inherit}.top{position:fixed;left:84px;right:20px;top:18px;z-index:20;display:flex;gap:12px;align-items:center;padding:12px 16px;border:1px solid #e5e7eb;border-radius:16px;background:rgba(255,255,255,.9);box-shadow:0 16px 45px #11182714}.top h1{margin:0;font-size:17px}.top p{margin:3px 0 0;color:#8a94a3;font-size:12px}.tools{position:fixed;left:16px;top:50%;z-index:30;display:grid;gap:8px;width:54px;padding:8px;border:1px solid #e5e7eb;border-radius:18px;background:#fff;box-shadow:0 18px 45px #1118271f;transform:translateY(-50%)}.btn{width:38px;height:38px;border:0;border-radius:12px;background:#f6f7f8;cursor:pointer}.btn.on,.btn.dark{background:#111827;color:#fff}.btn:hover{outline:2px solid #14bfd1}.wrap{position:fixed;inset:0;overflow:auto;background-image:linear-gradient(#1118270b 1px,transparent 1px),linear-gradient(90deg,#1118270b 1px,transparent 1px);background-size:40px 40px}.size{position:relative;width:2200px;height:1400px}.stage{position:relative;width:2200px;height:1400px;transform-origin:0 0}.edges{position:absolute;inset:0;width:2200px;height:1400px;pointer-events:none}.edge{fill:none;stroke:#111827;stroke-width:2}.node{position:absolute;z-index:2;width:250px;min-height:142px;border:1px solid #dfe3e8;border-radius:12px;background:#fffffff5;box-shadow:0 12px 35px #11182712;user-select:none}.node.sel{outline:2px solid #14bfd1}.node.src{outline:3px solid #f7b955}.head{display:flex;justify-content:space-between;gap:8px;padding:8px;color:#8e97a3;font-size:12px;font-weight:700}.body{padding:0 8px 8px}.body textarea{width:100%;min-height:70px;border:0;border-radius:10px;padding:8px;resize:none;background:#fff;color:#111827}.body img{display:block;width:100%;height:150px;object-fit:contain;background:#f7f8fa}.add{position:absolute;right:-12px;top:50%;width:24px;height:24px;border:2px solid #fff;border-radius:50%;background:#14bfd1;color:#fff;transform:translateY(-50%);cursor:pointer}.mini{width:100%;min-height:26px;margin-top:6px;border:0;border-radius:9px;background:#f3f5f7;cursor:pointer;font-size:12px}.status{display:flex;justify-content:space-between;margin-top:6px;color:#a3acb8;font-size:11px}.resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize}.resize:after{content:"";position:absolute;right:5px;bottom:5px;width:8px;height:8px;border-right:2px solid #aab2bd;border-bottom:2px solid #aab2bd}.box{position:absolute;z-index:40;border:1px dashed #14bfd1;background:#14bfd114;pointer-events:none}.float{position:absolute;z-index:50;display:flex;gap:4px;padding:8px;border:1px solid #e5e7eb;border-radius:14px;background:#fff;box-shadow:0 18px 45px #11182721;transform:translateX(-50%)}.float button{border:0;border-radius:10px;background:transparent;padding:7px 10px;cursor:pointer}.float button:hover{background:#f3f5f7}.panel{position:fixed;right:18px;top:92px;bottom:18px;z-index:25;width:330px;overflow:auto;padding:16px;border:1px solid #e5e7eb;border-radius:18px;background:#ffffffe6;box-shadow:0 20px 60px #1118271f}.panel h2{margin:0 0 12px;font-size:14px}.panel label{display:grid;gap:6px;margin:10px 0;color:#6b7280;font-size:12px}.panel input,.panel textarea,.panel select{width:100%;border:1px solid #e5e7eb;border-radius:10px;padding:9px;background:#fbfcfd}.act{width:100%;min-height:38px;margin-top:8px;border:0;border-radius:10px;background:#111827;color:#fff;cursor:pointer}.danger{background:#c2414b}.hint{position:fixed;left:50%;bottom:24px;z-index:20;display:none;transform:translateX(-50%);padding:10px 14px;border-radius:999px;background:#111827;color:#fff}.hint.show{display:block}.toast{position:fixed;right:22px;bottom:18px;z-index:99;display:none;max-width:330px;padding:12px 14px;border-radius:14px;background:#111827;color:#fff;font-size:13px}.toast.show{display:block}.zoom{position:fixed;right:22px;bottom:18px;z-index:18;padding:8px 10px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;color:#4b5563;font-size:12px}.tpl{position:fixed;left:84px;top:50%;z-index:60;width:280px;max-height:520px;overflow:auto;padding:12px;border:1px solid #e5e7eb;border-radius:18px;background:#fff;box-shadow:0 24px 60px #11182729;transform:translateY(-50%)}.tpl button{display:block;width:100%;margin:6px 0;padding:10px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;text-align:left;cursor:pointer}
</style></head><body>
<div class="top"><div><h1>电商 AI 自动化作图工作台</h1><p>框选多个节点后，点击浮动条的 AI文本 / AI图片，会自动生成新节点并连接所有选中节点。</p></div></div>
<div class="tools"><button id="addText" class="btn dark" title="文本">T</button><button id="addImg" class="btn" title="图片">▧</button><button id="addAiT" class="btn" title="AI文本">✦T</button><button id="addAiI" class="btn" title="AI图片">✦▧</button><button id="conn" class="btn" title="连接">⌁</button><button id="runAll" class="btn" title="运行全部">▶</button><button id="tplBtn" class="btn" title="模板">▣</button><button id="save" class="btn" title="保存">💾</button></div>
<main id="wrap" class="wrap"><div id="size" class="size"><div id="stage" class="stage"><svg id="edges" class="edges"></svg><div id="nodes"></div></div></div></main>
<aside class="panel"><h2>节点属性</h2><div id="empty">选择节点后编辑。</div><div id="editor" style="display:none"><label>名称<input id="title"></label><label id="textBox">内容<textarea id="text"></textarea></label><label id="promptBox">提示词<textarea id="prompt"></textarea></label><label id="imgBox">图片<input id="imgFile" type="file" accept="image/*"></label><label>输出类型<select id="out"><option value="text">文本</option><option value="image">图片</option></select></label><button id="runOne" class="act">运行当前节点</button><button id="del" class="act danger">删除节点</button><h2 style="margin-top:18px">输出</h2><textarea id="result" rows="8" readonly></textarea></div><h2 style="margin-top:18px">模板</h2><label>模板名<input id="tplName" placeholder="如：主图流程"></label><button id="saveTpl" class="act">保存为模板</button></aside>
<div id="hint" class="hint"></div><div id="zoom" class="zoom">100%</div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s),S={nodes:[],edges:[],sel:[],src:[],next:1,zoom:1,connect:false,drag:null,resize:null,marq:null,pan:null,space:false};
const esc=v=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function uid(){return'n'+S.next++}function node(id){return S.nodes.find(n=>n.id===id)}function selected(){return S.sel.map(node).filter(Boolean)}
function add(kind,out=kind,x=120+S.nodes.length*42,y=140+S.nodes.length*34,from){const n={id:uid(),kind,out,title:kind==='ai'?(out==='image'?'AI 图片生成':'AI 文本生成'):(kind==='image'?'图片节点':'文本节点'),text:kind==='text'?'输入商品信息、卖点或要求':'',prompt:kind==='ai'?'请根据所有输入节点，生成适合电商使用的内容。':'',image:'',result:'',x,y,w:kind==='image'?220:250,h:kind==='image'?250:170,status:'待执行'};S.nodes.push(n);if(from)link(from,n.id);select([n.id]);render();return n}
function select(ids){S.sel=[...new Set(ids)];edit()}function bounds(ids){const ns=ids.map(node).filter(Boolean);if(!ns.length)return null;const l=Math.min(...ns.map(n=>n.x)),t=Math.min(...ns.map(n=>n.y)),r=Math.max(...ns.map(n=>n.x+n.w)),b=Math.max(...ns.map(n=>n.y+n.h));return{l,t,r,b,w:r-l,h:b-t}}
function render(){renderNodes();renderEdges();renderFloat();$('#conn').classList.toggle('on',S.connect);$('#hint').classList.toggle('show',S.connect);$('#hint').textContent=S.connect?'连接模式：点源节点再点目标；多选后点其中一个，再点目标可批量连接':'';$('#zoom').textContent=Math.round(S.zoom*100)+'%';$('#stage').style.transform=`scale(${S.zoom})`;$('#size').style.width=2200*S.zoom+'px';$('#size').style.height=1400*S.zoom+'px'}
function renderNodes(){const box=$('#nodes');box.innerHTML=S.nodes.map(n=>`<article class="node ${S.sel.includes(n.id)?'sel':''} ${S.src.includes(n.id)?'src':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px"><button class="add" data-add="${n.id}">+</button><div class="head"><span>${esc(n.title)}</span><small>${n.kind==='ai'?'AI→'+(n.out==='image'?'图片':'文本'):n.kind==='image'?'图片':'文本'}</small></div><div class="body">${body(n)}<div class="status"><span>${n.status}</span><span>${S.edges.filter(e=>e.to===n.id).length}入/${S.edges.filter(e=>e.from===n.id).length}出</span></div><button class="mini" data-run="${n.id}">运行此节点</button></div><span class="resize"></span></article>`).join('');box.querySelectorAll('.node').forEach(el=>{el.onpointerdown=down;el.onclick=clickNode});box.querySelectorAll('.add').forEach(b=>b.onclick=e=>{e.stopPropagation();const f=b.dataset.add;add('ai','text',node(f).x+310,node(f).y,f)});box.querySelectorAll('[data-run]').forEach(b=>b.onclick=e=>{e.stopPropagation();run(node(b.dataset.run))});box.querySelectorAll('textarea').forEach(t=>{t.onpointerdown=e=>e.stopPropagation();t.oninput=()=>{const n=node(t.dataset.id);n[t.dataset.f]=t.value;if(n.id===S.sel[0])edit()}});box.querySelectorAll('input[type=file]').forEach(i=>i.onchange=e=>loadImg(i.dataset.id,e.target.files[0]));box.querySelectorAll('.resize').forEach(r=>r.onpointerdown=resizeDown)}
function body(n){if(n.kind==='image')return n.image?`<img src="${n.image}"><input data-id="${n.id}" type="file" accept="image/*">`:`<input data-id="${n.id}" type="file" accept="image/*">`;if(n.kind==='text')return`<textarea data-id="${n.id}" data-f="text">${esc(n.text)}</textarea>`;return`<textarea data-id="${n.id}" data-f="prompt">${esc(n.prompt)}</textarea>${n.result?`<textarea readonly>${esc(n.result)}</textarea>`:''}`}
function renderEdges(){edges.innerHTML=S.edges.map(e=>{const a=node(e.from),b=node(e.to);if(!a||!b)return'';const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,m=Math.max(70,Math.abs(x2-x1)/2);return`<path class="edge" d="M ${x1} ${y1} C ${x1+m} ${y1}, ${x2-m} ${y2}, ${x2} ${y2}"></path>`}).join('')}
function renderFloat(){document.querySelector('.float')?.remove();if(S.sel.length<2)return;const b=bounds(S.sel),f=document.createElement('div');f.className='float';f.style.left=b.l+b.w/2+'px';f.style.top=Math.max(8,b.t-54)+'px';f.innerHTML='<button data-a="run">运行</button><button data-a="ait">AI文本</button><button data-a="aii">AI图片</button><button data-a="copy">复制</button><button data-a="tpl">存模板</button>';f.onclick=e=>{const a=e.target.dataset.a;if(a==='run')selected().forEach(run);if(a==='ait')aiFromSel('text');if(a==='aii')aiFromSel('image');if(a==='copy')copySel();if(a==='tpl')saveTemplate(true)};stage.appendChild(f)}
function aiFromSel(out){if(S.sel.length<2)return toast('请先框选两个以上节点');const b=bounds(S.sel),n=add('ai',out,b.r+140,b.t+Math.max(0,(b.h-(out==='image'?220:168))/2));S.sel.filter(id=>id!==n.id).forEach(id=>link(id,n.id));select([n.id]);render();toast('已生成新 AI 节点，并连接 '+(S.sel.length||1)+' 个输入节点')}
function clickNode(e){const id=e.currentTarget.dataset.id;if(!S.connect)return;e.stopPropagation();if(!S.src.length){S.src=S.sel.length>1&&S.sel.includes(id)?[...S.sel]:[id];toast('已选择连接源，请点击目标节点');render();return}if(S.src.includes(id)){S.src=[];render();return}let c=0;S.src.forEach(s=>{if(s!==id){link(s,id);c++}});S.src=[];render();toast('已处理 '+c+' 条连线')}
function link(a,b){const i=S.edges.findIndex(e=>e.from===a&&e.to===b);if(i>=0)S.edges.splice(i,1);else S.edges.push({from:a,to:b})}
function down(e){if(e.button||S.space||S.connect||e.target.closest('textarea,input,button,.resize'))return;const id=e.currentTarget.dataset.id;if(!S.sel.includes(id))select([id]);S.drag={x:e.clientX,y:e.clientY,orig:selected().map(n=>({id:n.id,x:n.x,y:n.y}))};e.currentTarget.setPointerCapture(e.pointerId)}function resizeDown(e){e.stopPropagation();const n=node(e.target.closest('.node').dataset.id);select([n.id]);S.resize={id:n.id,x:e.clientX,y:e.clientY,w:n.w,h:n.h};e.target.setPointerCapture(e.pointerId)}
window.onpointermove=e=>{if(S.marq){const p=pt(e);S.marq.x=p.x;S.marq.y=p.y;drawBox();return}if(S.pan){wrap.scrollLeft=S.pan.l-(e.clientX-S.pan.x);wrap.scrollTop=S.pan.t-(e.clientY-S.pan.y);return}if(S.resize){const n=node(S.resize.id);n.w=Math.max(180,S.resize.w+(e.clientX-S.resize.x)/S.zoom);n.h=Math.max(110,S.resize.h+(e.clientY-S.resize.y)/S.zoom);render();return}if(S.drag){const dx=(e.clientX-S.drag.x)/S.zoom,dy=(e.clientY-S.drag.y)/S.zoom;S.drag.orig.forEach(o=>{const n=node(o.id);n.x=Math.max(8,o.x+dx);n.y=Math.max(8,o.y+dy)});render()}};window.onpointerup=()=>{if(S.marq){selectInBox();document.querySelector('.box')?.remove();S.marq=null;render()}S.drag=S.resize=S.pan=null};
wrap.onpointerdown=e=>{if(S.space&&e.button===0){S.pan={x:e.clientX,y:e.clientY,l:wrap.scrollLeft,t:wrap.scrollTop};return}if(e.button||S.connect||e.target.closest('.node,.tools,.panel,.top'))return;const p=pt(e);S.marq={sx:p.x,sy:p.y,x:p.x,y:p.y};select([]);drawBox()};function pt(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/S.zoom,y:(e.clientY-r.top)/S.zoom}}function drawBox(){let b=document.querySelector('.box');if(!b){b=document.createElement('div');b.className='box';stage.appendChild(b)}const m=S.marq,l=Math.min(m.sx,m.x),t=Math.min(m.sy,m.y);Object.assign(b.style,{left:l+'px',top:t+'px',width:Math.abs(m.x-m.sx)+'px',height:Math.abs(m.y-m.sy)+'px'})}function selectInBox(){const m=S.marq,l=Math.min(m.sx,m.x),t=Math.min(m.sy,m.y),r=Math.max(m.sx,m.x),b=Math.max(m.sy,m.y);select(S.nodes.filter(n=>l<=n.x+n.w&&r>=n.x&&t<=n.y+n.h&&b>=n.y).map(n=>n.id))}
window.onkeydown=e=>{if(e.target.matches('input,textarea,select'))return;if(e.code==='Space'){e.preventDefault();S.space=true}if(e.key==='Delete'&&S.sel.length)del()};window.onkeyup=e=>{if(e.code==='Space')S.space=false};wrap.onwheel=e=>{e.preventDefault();const z=S.zoom;S.zoom=Math.min(2.5,Math.max(.35,S.zoom*(e.deltaY>0?.925:1.08)));const r=wrap.getBoundingClientRect(),fx=e.clientX-r.left,fy=e.clientY-r.top,cx=(wrap.scrollLeft+fx)/z,cy=(wrap.scrollTop+fy)/z;render();wrap.scrollLeft=cx*S.zoom-fx;wrap.scrollTop=cy*S.zoom-fy};
function edit(){const n=node(S.sel[0]);empty.style.display=n?'none':'block';editor.style.display=n?'block':'none';if(!n)return;title.value=n.title;text.value=n.text||'';prompt.value=n.prompt||'';out.value=n.out;result.value=n.result||'';textBox.style.display=n.kind==='text'?'grid':'none';promptBox.style.display=n.kind==='ai'?'grid':'none';imgBox.style.display=n.kind==='image'?'grid':'none'}['title','text','prompt','out'].forEach(id=>$('#'+id).oninput=e=>{const n=node(S.sel[0]);if(!n)return;n[id==='out'?'out':id]=e.target.value;render()});imgFile.onchange=e=>loadImg(S.sel[0],e.target.files[0]);function loadImg(id,file){if(!file)return;const r=new FileReader();r.onload=()=>{const n=node(id);n.image=r.result;n.kind='image';render();edit()};r.readAsDataURL(file)}
function run(n){if(!n)return;n.status='运行中';render();setTimeout(()=>{const ins=S.edges.filter(e=>e.to===n.id).map(e=>node(e.from)).filter(Boolean).map(x=>x.result||x.text||x.title).join('\n');n.result=n.out==='image'?'已模拟生成图片节点，可接入真实模型 API。':`【${n.title}】\n输入：${ins||'无'}\n输出：已生成电商标题、卖点文案、场景说明和优化建议。`;n.status='已完成';render();edit()},350)}function copySel(){const mp=new Map,c=S.sel.map(id=>{const o=node(id),n={...o,id:uid(),x:o.x+42,y:o.y+42,title:o.title+' 副本'};mp.set(id,n.id);return n});S.nodes.push(...c);S.edges.push(...S.edges.filter(e=>mp.has(e.from)&&mp.has(e.to)).map(e=>({from:mp.get(e.from),to:mp.get(e.to)})));select(c.map(n=>n.id));render()}function del(){S.nodes=S.nodes.filter(n=>!S.sel.includes(n.id));S.edges=S.edges.filter(e=>!S.sel.includes(e.from)&&!S.sel.includes(e.to));select([]);render()}function saveTemplate(part){const name=part?prompt('模板名称','局部模板 '+new Date().toLocaleString()):tplName.value||'工作流模板';if(!name)return;const ids=part?S.sel:S.nodes.map(n=>n.id),set=new Set(ids),data={nodes:S.nodes.filter(n=>set.has(n.id)),edges:S.edges.filter(e=>set.has(e.from)&&set.has(e.to))};const list=JSON.parse(localStorage.templates||'[]');list.unshift({name,data});localStorage.templates=JSON.stringify(list);toast('模板已保存')}function openTpl(){document.querySelector('.tpl')?.remove();const list=JSON.parse(localStorage.templates||'[]'),p=document.createElement('div');p.className='tpl';p.innerHTML='<b>模板库</b>'+(list.length?'':'<p>暂无模板</p>')+list.map((t,i)=>`<button data-i="${i}">${esc(t.name)}<br><small>${t.data.nodes.length} 节点</small></button>`).join('');p.onclick=e=>{if(e.target.dataset.i!=null){const t=list[e.target.dataset.i].data,mp=new Map;t.nodes.forEach(o=>{const n={...o,id:uid(),x:o.x+80,y:o.y+80};mp.set(o.id,n.id);S.nodes.push(n)});S.edges.push(...t.edges.map(e=>({from:mp.get(e.from),to:mp.get(e.to)})));select([...mp.values()]);p.remove();render()}};document.body.appendChild(p)}
addText.onclick=()=>add('text');addImg.onclick=()=>add('image');addAiT.onclick=()=>add('ai','text');addAiI.onclick=()=>add('ai','image');conn.onclick=()=>{S.connect=!S.connect;S.src=[];render()};runAll.onclick=()=>S.nodes.forEach(run);tplBtn.onclick=openTpl;saveTpl.onclick=()=>saveTemplate(false);runOne.onclick=()=>run(node(S.sel[0]));del.onclick=del;save.onclick=()=>{localStorage.workflow=JSON.stringify(S);toast('已保存')};
add('image','image',120,150);add('text','text',120,440);add('ai','text',460,230,S.nodes[0].id);link(S.nodes[1].id,S.nodes[2].id);render();
</script></body></html>
